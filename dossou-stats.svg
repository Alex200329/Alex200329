<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220" role="img" aria-label="GitHub stats">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3D5AFE"/><stop offset="1" stop-color="#9B6BFF"/></linearGradient>
<radialGradient id="h" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#3D5AFE" stop-opacity="0.22"/><stop offset="1" stop-color="#3D5AFE" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .t{fill:#E6EDF3;font-weight:700} .d{fill:#8B96B5;font-weight:500}
.a{animation:f .8s ease-out both} @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
<rect x="0.5" y="0.5" width="494" height="219" rx="16" fill="#10141F" stroke="#1F2638"/>
<rect x="0.5" y="0.5" width="494" height="219" rx="16" fill="url(#h)"/>
<text x="28" y="44" class="t" font-size="18">GitHub stats</text><rect x="28" y="54" width="44" height="3" rx="1.5" fill="url(#g)"/><g class="a" style="animation-delay:0.00s"><text x="28" y="88" class="d" font-size="13">Contributions (last year)</text><text x="300" y="88" class="t" font-size="13" text-anchor="end">4 210</text></g><g class="a" style="animation-delay:0.08s"><text x="28" y="112" class="d" font-size="13">Total commits</text><text x="300" y="112" class="t" font-size="13" text-anchor="end">4 694</text></g><g class="a" style="animation-delay:0.16s"><text x="28" y="136" class="d" font-size="13">Pull requests</text><text x="300" y="136" class="t" font-size="13" text-anchor="end">96</text></g><g class="a" style="animation-delay:0.24s"><text x="28" y="160" class="d" font-size="13">Repositories</text><text x="300" y="160" class="t" font-size="13" text-anchor="end">121</text></g><g class="a" style="animation-delay:0.32s"><text x="28" y="184" class="d" font-size="13">Stars earned</text><text x="300" y="184" class="t" font-size="13" text-anchor="end">10</text></g><circle cx="400" cy="112" r="50" fill="none" stroke="#1F2638" stroke-width="8"/><circle cx="400" cy="112" r="50" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="250 314" transform="rotate(-90 400 112)"/><text x="400" y="108" class="t" font-size="24" text-anchor="middle">3+</text><text x="400" y="128" class="d" font-size="11" text-anchor="middle">years coding</text></svg>