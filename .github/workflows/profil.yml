# Visuels du profil générés chaque jour (aucun service externe) et publiés sur la branche « sortie » :
#   - serpent qui mange la grille des contributions (Platane/snk) ;
#   - calendrier 3D des contributions et succès (lowlighter/metrics).
# Avec un secret METRICS_TOKEN (jeton classique, droits read:user et repo), les dépôts privés sont comptés.
name: Profil

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: false

jobs:
  serpent:
    name: Serpent des contributions
    runs-on: ubuntu-24.04
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent-clair.svg?color_snake=#FF9432&color_dots=#EBEDF0,#FFD8A5,#FFBC6D,#FF9432,#FF740A
            dist/serpent-sombre.svg?palette=github-dark&color_snake=#FF9432&color_dots=#161B22,#4A2A0A,#8A4A10,#FF9432,#FFBC6D
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: sortie
          build_dir: dist
          keep_history: false
          commit_message: "Serpent des contributions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metriques:
    name: Calendrier et succès
    needs: serpent
    runs-on: ubuntu-24.04
    steps:
      - name: Calendrier 3D des contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: calendrier.svg
          committer_branch: sortie
          committer_message: "Calendrier des contributions"
          config_timezone: Africa/Porto-Novo
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Succès (trophées)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: succes.svg
          committer_branch: sortie
          committer_message: "Succès"
          config_timezone: Africa/Porto-Novo
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12
